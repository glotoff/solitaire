<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#0f3d21"/>
      <stop offset="100%" stop-color="#072212"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Under card: Ace of Spades rotated left -->
  <g transform="translate(190, 260) rotate(-16)" filter="url(#cardShadow)">
    <rect x="-90" y="-135" width="180" height="270" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="-70" y="-85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#0f172a">A</text>
    <path d="M-60,-75 C-60,-75 -50,-62 -50,-56 C-50,-51 -55,-47 -60,-47 C-63,-47 -66,-49 -67,-52 C-68,-49 -71,-47 -74,-47 C-79,-47 -84,-51 -84,-56 C-84,-62 -74,-75 -74,-75 C-74,-75 -70,-65 -67,-61 C-68,-57 -66,-53 -67,-45 L-67,-42 L-61,-42 L-61,-45 C-62,-53 -60,-57 -61,-61 Z" fill="#0f172a"/>
    <!-- Big Spade center -->
    <path d="M0,-50 C0,-50 45,5 45,30 C45,50 25,65 5,65 C-8,65 -15,55 -15,55 L-10,75 L-30,75 L-25,55 C-25,55 -32,65 -45,65 C-65,65 -85,50 -85,30 C-85,5 -40,-50 -40,-50 C-40,-50 -10,-20 -20,25 L-5,25 Z" transform="translate(20, -10) scale(0.9)" fill="#0f172a"/>
  </g>

  <!-- Top card: King of Hearts rotated right -->
  <g transform="translate(300, 270) rotate(12)" filter="url(#shadow)">
    <rect x="-90" y="-135" width="180" height="270" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
    <!-- Red Index -->
    <text x="-72" y="-85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#dc2626">K</text>
    <!-- Small heart -->
    <path d="M-60,-65 C-60,-73 -52,-77 -46,-73 C-40,-69 -40,-61 -40,-61 C-40,-61 -40,-69 -34,-73 C-28,-77 -20,-73 -20,-65 C-20,-55 -40,-38 -40,-38 C-40,-38 -60,-55 -60,-65 Z" transform="translate(-20, 10) scale(0.8)" fill="#dc2626"/>
    <!-- Heart center -->
    <path d="M0,-25 C0,-52 35,-65 55,-45 C75,-25 75,5 50,35 L0,85 L-50,35 C-75,5 -75,-25 -55,-45 C-35,-65 0,-52 0,-25 Z" fill="#dc2626"/>
    <!-- Crown icon on King -->
    <path d="M-30,-75 L-15,-55 L0,-80 L15,-55 L30,-75 L25,-40 L-25,-40 Z" fill="url(#goldGrad)" stroke="#854d0e" stroke-width="2"/>
  </g>

  <!-- Crown badge at bottom or top -->
  <g transform="translate(256, 435)">
    <rect x="-110" y="-22" width="220" height="44" rx="22" fill="#022c14" stroke="url(#goldGrad)" stroke-width="3"/>
    <text x="0" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#fef08a" text-anchor="middle" letter-spacing="4">SOLITAIRE</text>
  </g>
</svg>